# Deployment template for a future HTTPS host. Supply values with an env file;
# this file does not provision PostgreSQL or a public reverse proxy.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable sha-tagged image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      FRONTEND_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      PASSWORD_RESET_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/reset-password
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    expose:
      - '5000'

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable sha-tagged image}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:5000
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-8080}:8080'
    depends_on:
      - backend
