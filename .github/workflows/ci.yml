name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travel_marketplace
          POSTGRES_USER: travel_marketplace
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_marketplace -d travel_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://travel_marketplace:ci-only-password@localhost:5432/travel_marketplace
      DATABASE_URL_TEST: postgresql://travel_marketplace:ci-only-password@localhost:5432/travel_marketplace_test
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ci-only-jwt-secret-never-used-outside-tests-123456
      PASSWORD_RESET_URL: http://localhost:5173/reset-password
      ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and generate Prisma client
        run: |
          npm run prisma:validate
          npm run prisma:generate

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run lint:openapi --workspace backend

      - name: Frontend tests
        run: npm run test --workspace frontend

      - name: Backend integration tests
        run: npm run test --workspace backend
        env:
          NODE_ENV: test

      - name: Production builds
        run: npm run build

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

  publish:
    name: publish-${{ matrix.component }}
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
